# Live market prices for the model pages, the market tape (tape.py) and the game-day watcher (watch.py). Every 15 minutes: re-quote Kalshi and Polymarket for any
# sport with a game in the next 12 hours (exits in seconds otherwise) and publish
# markets/live_<sport>.json, which the NFL / NHL / NBA pages poll. Needs no databases: it reads the
# saved projections in engine/. Polymarket books are also fetched live by the browser.
name: markets

on:            # started by the Cloudflare Worker sim-sheet-cron (Eastern-time schedule), or by hand
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIM_SITE: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      TZ: America/New_York
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -q -r engine/requirements.txt
      - id: q
        working-directory: engine
        run: |
          set +e; python markets.py live; rc=$?; set -e
          [ $rc -eq 10 ] && echo "skip=true" >> "$GITHUB_OUTPUT" || { [ $rc -eq 0 ] || exit $rc; }
      - name: Sportsbook game lines (Unabated with Gambly links; The Odds API for the books it lacks, credit-paced)
        if: steps.q.outputs.skip != 'true'
        working-directory: engine
        env:
          UNABATED_API_KEY: ${{ secrets.UNABATED_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python books.py || true
      - name: Value tags on player props (SharpAPI; publishes only our tag, no book data)
        if: steps.q.outputs.skip != 'true'
        working-directory: engine
        env:
          UNABATED_API_KEY: ${{ secrets.UNABATED_API_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python sharp.py || true
      - name: Watch for late scratches and line moves (re-runs a sport's model if needed)
        if: steps.q.outputs.skip != 'true'
        working-directory: engine
        run: python watch.py
      - name: Parlay record (freeze every parlay card before the day's first game, grade from box scores, publish the Parlays tab)
        working-directory: engine
        run: |
          if [ "${{ steps.q.outputs.skip }}" != "true" ]; then python parlays.py freeze || true; fi
          python parlays.py grade || true
          python parlays.py page || true
      - name: Profit page (Value tags' price when tagged vs closing price; every sport's graded picks and parlays)
        working-directory: engine
        run: |
          python profit.py tags || true
          python profit.py page || true
      - run: |
          git config user.name "sim-sheet-bot"
          git config user.email "sim-sheet-bot@users.noreply.github.com"
          git add -A markets engine/markets engine/parlays
          for f in nhl/parlays.html nfl/parlays.html profit.html parlays.html; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Auto: market prices $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i * 5)); done
          gh workflow run deploy.yml
