# NBA on GitHub's servers (works with the PC off). Independent of the other sports: own
# schedule, own queue, own data cache. Times are UTC = Eastern daylight time + 4h.
name: nba

on:            # started by the Cloudflare Worker sim-sheet-cron (Eastern-time schedule), or by hand
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nba
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIM_SITE: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      TZ: America/New_York
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-sport
        with:
          mode: nba
          cache-name: nba-db
          cache-paths: engine/nba/nba.db
          seed: nba.db.gz
      # NBA picks lock only after the first game's confirmed lineups are in a run (owner 2026-10-28): when a game tips
      # within 45 min, start a markets run now so the card re-picks from this run instead of waiting up to 15 min
      - name: Re-pick the NBA card from fresh lineups
        if: success()
        working-directory: engine
        run: |
          set +e; python nba/should_run.py --soon 45; rc=$?; set -e
          if [ $rc -eq 0 ]; then gh workflow run markets.yml || true; fi
