# Publish the site when changes are pushed from the PC (the pipeline workflow deploys its own runs).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Overlay the live branch (pages + engine state live there; engine/publish.py)
        env:
          LIVE_BRANCH: live
        run: python3 engine/publish.py start
      - run: |
          mkdir -p /tmp/pages
          rsync -a --exclude engine --exclude .github --exclude .git ./ /tmp/pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages
      # GitHub can take a while to show deploy-pages a just-uploaded artifact: on 2026-11-24 four deploys
      # in a row failed with 'No artifacts named github-pages' 0.3-0.6 s after the upload finalized, so the
      # site sat an hour behind (the REST listing had it at once; deploy-pages' lookup didn't). Pause, then
      # retry once after 45 s (the retry is what worked).
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
