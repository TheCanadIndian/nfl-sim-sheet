# NFL on GitHub's servers (works with the PC off). Independent of the other sports: own
# schedule, own queue, own data cache. Times are UTC = Eastern *Daylight* time + 4h; after
# Nov 1, 2026 (standard time) runs land an hour earlier in ET unless the hours are bumped by 1.
name: nfl

on:            # started by the Cloudflare Worker sim-sheet-cron (Eastern-time schedule), or by hand
  workflow_dispatch:
    inputs:
      mode:
        description: "nfl | nfl --news | learn --sport nfl"
        default: "nfl"

permissions:
  contents: write
  actions: write

concurrency:
  group: nfl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SIM_SITE: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      TZ: America/New_York
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "0 14 * * 2") m="learn --sport nfl" ;;
            "30 20 * * 4"|"30 14 * * 0"|"30 21 * * 1") m="nfl --news" ;;
            "") m="${{ inputs.mode }}" ;;
            *) m="nfl" ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/run-sport
        with:
          mode: ${{ steps.mode.outputs.mode }}
          cache-name: nfl-db
          cache-paths: engine/nfl.db
          seed: nfl.db.gz
